version: '3.8'
 
services:
  # 1. Aplicação Principal (Frontend Flet)
  opera-app:
    # build: .
    image: opera_app_image
    container_name: opera-ia-frontend
    restart: unless-stopped
    ports:
      - "8550:8550"
      - "80:8550"    # Adiciona a porta 80 escutando e jogando para a 8550
      - "8080:8550"  # terceira porta opcional    
    volumes:
      - opera_data:/app/data
      # Mapeamento de código (Hot-reload no servidor)
      - ./SOURCE:/app/SOURCE
      - ./assets:/app/assets
      - ./logs:/app/logs      
      - ./uploads_temp:/app/uploads_temp      
      - ./run_server.py:/app/run_server.py
    environment:
      - APP_MODE=server
      - PORT=8550
      - FLET_SECRET_KEY=oTSHabCz0q5slF4OjKHUmh1zr/fVZDvtoZMECrwYJRI=
      - TZ=America/Sao_Paulo
      - SERVER_DATA_DIR=/app/data
      - DPF_SECRET_SIST_OPERA_FIREBASE_ENCRYPTION_KEY=m0MMyi6H8ih9wjRTDZPsV6lqJKUQiI8KuuThQjK9eHc=
      # --- Configuração de Proxy Corporativo ---
      # Descomente e preencha com os dados da rede (ex: http://usuario:senha@10.x.x.x:porta)
      - HTTP_PROXY=http://proxy.dpf.gov.br:8080
      - HTTPS_PROXY=http://proxy.dpf.gov.br:8080
      - NO_PROXY=localhost,127.0.0.1,10.2.2.10,10.2.2.10:31893

